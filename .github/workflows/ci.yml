name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  lightning:
    name: Live Lightning (NWC faucet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Real wallets on public Nostr relays: informative, never blocks a merge on a relay outage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:nwc

  docker:
    name: One-command Docker run + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up --build -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Demo shop, pay link, invoice, payment, receipt
        run: bash scripts/smoke.sh http://localhost:3000
      - name: Logs
        if: always()
        run: docker compose logs app | tail -50
